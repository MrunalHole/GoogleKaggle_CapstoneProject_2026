[project]
name = "parkinsons-backend"
version = "0.1.0"
description = "FastAPI backend for Parkinson's Disease Screening"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pydantic[email]>=2.6.0",
    "pydantic-settings>=2.2.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "google-genai>=0.1.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "praat-parselmouth>=0.4.3",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.0",
    "pyjwt>=2.8.0",
    "librosa>=0.11.0",
    "soundfile>=0.12.0",
    "openpyxl>=3.1.0",
    "imageio-ffmpeg>=0.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

